# Base en memoria (H2) para pruebas y para arrancar sin MySQL con: mvnw spring-boot:test-run
spring.datasource.url=jdbc:h2:mem:viveros_tienda;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
