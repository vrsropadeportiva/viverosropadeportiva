spring.application.name=tienda

# MySQL. Se puede sobrescribir con las variables DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/viveros_tienda?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
